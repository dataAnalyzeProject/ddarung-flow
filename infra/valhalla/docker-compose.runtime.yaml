services:
  valhalla:
    image: ghcr.io/valhalla/valhalla@sha256:4ac3d13d1019f9a130e9e6b6924c16ea55da0fa51e3653039152e33ad4095661
    platform: linux/arm64
    profiles: ["valhalla"]
    command: ["valhalla_service", "/data/graph/valhalla.json", "1"]
    volumes:
      - ${VALHALLA_GRAPH_DIR:?set VALHALLA_GRAPH_DIR}:/data/graph:ro
    expose:
      - "8002"
    restart: unless-stopped
    networks:
      - valhalla-private

networks:
  valhalla-private:
    internal: true
