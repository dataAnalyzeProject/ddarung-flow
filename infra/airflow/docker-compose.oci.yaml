services:
  # UI/API 컨테이너 포트는 127.0.0.1에만 bind한다(변경 없음). DEC-015에 따라
  # host nginx가 https://shdomain.kro.kr/airflow/ 로 이 loopback 포트를
  # 프록시한다 — 신규 공개 ingress·NSG 규칙은 추가하지 않고 기존 80/443만
  # 재사용한다. host 8080은 기존 crawling-backend가 이미 쓰고 있어
  # (OCI-STAGING-RUNBOOK.md의 "기존 loopback port 3000/5000/8080 재사용 금지"
  # 규칙과 동일 서버에서 실측 확인됨) 8280으로 bind한다. 컨테이너 내부 포트는
  # 8080 그대로 유지.
  airflow-api-server:
    ports: !override ["127.0.0.1:8280:8080"]
    command: api-server --proxy-headers
    environment:
      AIRFLOW__API__BASE_URL: https://shdomain.kro.kr/airflow
      # base_url이 붙으면 api-server의 모든 라우트(/execution/ 포함)가 이 경로
      # 아래로 옮겨간다. scheduler/dag-processor가 내부 통신에 쓰는
      # EXECUTION_API_SERVER_URL도 반드시 같은 prefix를 써야 한다 - 안 그러면
      # 태스크가 상태 보고를 못 해 전부 실패한다(2026-08-22 실제 발생·확인됨).
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/airflow/execution/

  airflow-scheduler:
    environment:
      BIKE_INVENTORY_SOURCE: api
      WEATHER_SOURCE: api
      RAW_STORAGE_MODE: oci
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/airflow/execution/

  airflow-dag-processor:
    environment:
      BIKE_INVENTORY_SOURCE: api
      WEATHER_SOURCE: api
      RAW_STORAGE_MODE: oci
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/airflow/execution/
