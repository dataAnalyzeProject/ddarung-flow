name: ddarung-flow-postgres

services:
  app-postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-ddarung_flow}
      POSTGRES_USER: ${DB_USERNAME:-ddarung_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ddarung_local_password}
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ddarung_app} -d ${DB_NAME:-ddarung_flow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ddarung-app-postgres:/var/lib/postgresql/data

volumes:
  ddarung-app-postgres:
