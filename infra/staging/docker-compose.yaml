services:
  frontend:
    image: ${FRONTEND_IMAGE:-ddarung-flow-frontend:local}
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_BASE_URL: ${REACT_APP_API_BASE_URL}
        REACT_APP_AUTH_BASE_URL: ${REACT_APP_AUTH_BASE_URL:-${REACT_APP_API_BASE_URL}}
        REACT_APP_KAKAO_MAP_APP_KEY: ${REACT_APP_KAKAO_MAP_APP_KEY}
        REACT_APP_TOSS_PAYMENTS_CLIENT_KEY: ${REACT_APP_TOSS_PAYMENTS_CLIENT_KEY}
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT}:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - staging

  backend:
    image: ${BACKEND_IMAGE:-ddarung-flow-backend:local}
    build:
      context: ../../backend
      dockerfile: Dockerfile
    environment:
      MODEL_ACTIVATION_LOCAL_TEST_FAIL_VERSION: ${MODEL_ACTIVATION_LOCAL_TEST_FAIL_VERSION:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      PORT: 8080
      FRONTEND_URL: ${REACT_APP_API_BASE_URL}
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-false}
      FLYWAY_BASELINE_VERSION: ${FLYWAY_BASELINE_VERSION:-1}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-local-disabled}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-local-disabled}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-local-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-local-disabled}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-local-disabled}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-local-disabled}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      AIRKOREA_SERVICE_KEY: ${AIRKOREA_SERVICE_KEY}
      KMA_SERVICE_KEY: ${KMA_SERVICE_KEY}
      TOSS_PAYMENTS_SECRET_KEY: ${TOSS_PAYMENTS_SECRET_KEY}
      PAYMENT_MODE: ${PAYMENT_MODE:-sandbox}
      INFERENCE_BASE_URL: http://inference:8081
      MODEL_ACTIVATION_INFERENCE_BASE_URL: http://inference:8081
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy
    volumes:
      - export-data:/app/exports
    restart: unless-stopped
    networks:
      - staging

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - staging

  inference:
    image: ${INFERENCE_IMAGE:-ddarung-flow-inference:local}
    build:
      context: ../inference
      dockerfile: Dockerfile
    environment:
      OCI_OBJECT_NAMESPACE: ${OCI_OBJECT_NAMESPACE:-nrzeviuvbcrd}
      MODEL_BUCKET: ${MODEL_BUCKET:-ddarung-flow-bucket}
      MODEL_OBJECT_KEY: ${MODEL_OBJECT_KEY:-models/data-3.1/2f2ece729fd4b03954212d2fcc2ece4cd07110c947fae1dfc0c7ba29cde34db9/model_winner.joblib}
      MODEL_SHA256: ${MODEL_SHA256:-2f2ece729fd4b03954212d2fcc2ece4cd07110c947fae1dfc0c7ba29cde34db9}
      MODEL_POINTER_KEY: ${MODEL_POINTER_KEY:-}
      MODEL_POINTER_SHA256: ${MODEL_POINTER_SHA256:-}
      MODEL_LOCAL_PATH: /models/model_winner.joblib
    volumes:
      - ${MODEL_LOCAL_PATH_HOST:-../../.local-models/model_winner.joblib}:/models/model_winner.joblib:ro
    restart: unless-stopped
    networks:
      - staging

  inventory-refresher:
    image: ${INVENTORY_REFRESHER_IMAGE:-ddarung-flow-inventory-refresher:local}
    build:
      context: ../..
      dockerfile: infra/inventory-refresher/Dockerfile
    environment:
      SEOUL_OPEN_API_KEY: ${SEOUL_OPEN_API_KEY}
      DATABASE_URL: postgresql://${DB_USERNAME}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      DB_HOST: postgres
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      INVENTORY_REFRESH_SECONDS: ${INVENTORY_REFRESH_SECONDS:-600}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - staging

networks:
  staging:

volumes:
  postgres-data:
  export-data:
