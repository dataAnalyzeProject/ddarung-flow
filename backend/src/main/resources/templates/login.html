<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>따릉이 - 로그인</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <!-- 로고 및 헤더 -->
            <div class="logo-container">
                <h1 style="color: var(--primary-color); font-size: 1.8rem; font-weight: 800; display: flex; align-items: center; gap: 8px;">
                    🚲 따릉이 Flow
                </h1>
            </div>
            
            <h2 class="title">로그인</h2>

            <!-- 에러 메시지 표시 영역 (Spring Security 로그인 실패 시) -->
            <div th:if="${param.error}" class="alert-error">
                이메일 또는 비밀번호가 올바르지 않습니다.
            </div>

            <!-- 이메일/비밀번호 일반 로그인 폼 -->
            <form th:action="@{/login}" method="post" class="login-form">
                <div class="input-group">
                    <label for="username">이메일</label>
                    <input type="email" id="username" name="username" placeholder="example@email.com" required autofocus>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">비밀번호</label>
                        <a href="#" class="forgot-link">비밀번호를 잊으셨나요?</a>
                    </div>
                    <input type="password" id="password" name="password" placeholder="비밀번호 입력" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <label for="remember-me">로그인 상태 유지</label>
                </div>

                <button type="submit" class="btn btn-primary">로그인</button>
            </form>

            <div class="divider">
                <span>또는 소셜 계정으로 로그인</span>
            </div>

            <!-- OAuth2 소셜 로그인 버튼 -->
            <div class="social-login">
                <a th:href="@{/oauth2/authorization/kakao}" href="/oauth2/authorization/kakao" class="btn btn-social" style="background-color: #FEE500; color: #191919; border: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#191919"><path d="M12 3c-4.97 0-9 3.185-9 7.115 0 2.557 1.707 4.8 4.27 6.054-.188.702-.682 2.545-.78 2.94-.123.493.18.487.38.354.157-.105 2.534-1.724 3.56-2.42.51.075 1.036.115 1.57.115 4.97 0 9-3.186 9-7.115S16.97 3 12 3z"/></svg>
                    카카오로 시작하기
                </a>
                <a th:href="@{/oauth2/authorization/naver}" href="/oauth2/authorization/naver" class="btn btn-social" style="background-color: #03CF5D; color: #FFFFFF; border: none;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M16.273 12.845 7.376 0H0v24h7.727V11.155L16.624 24H24V0h-7.727v12.845z"/></svg>
                    네이버로 시작하기
                </a>
                <a th:href="@{/oauth2/authorization/google}" href="/oauth2/authorization/google" class="btn btn-social">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    Google로 시작하기
                </a>
            </div>

            <div class="signup-footer">
                계정이 없으신가요? <a href="#">회원가입</a>
            </div>
        </div>
    </div>
</body>
</html>
