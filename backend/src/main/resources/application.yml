spring:
  application:
    name: ddarung-flow
  profiles:
    default: local
  docker:
    compose:
      enabled: false
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      client:
        registration:
          naver:
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - name
              - email
          google:
            scope:
              - profile
              - email
          kakao:
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        name: DDARUNG_SESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}

journey:
  enabled: ${JOURNEY_ENABLED:false}
  ai:
    enabled: ${JOURNEY_AI_ENABLED:false}
    responses-uri: ${JOURNEY_AI_RESPONSES_URI:https://api.deepseek.com/responses}
    api-key: ${JOURNEY_AI_API_KEY:}
    model: ${JOURNEY_AI_MODEL:deepseek-v4-flash}
    timeout: ${JOURNEY_AI_TIMEOUT:10s}
  return-prediction:
    enabled: ${RETURN_PREDICTION_ENABLED:false}
    base-url: ${RETURN_PREDICTION_BASE_URL:http://return-inference:8082}
    timeout: ${RETURN_PREDICTION_TIMEOUT:2s}
    max-response-age: ${RETURN_PREDICTION_MAX_RESPONSE_AGE:15m}
  phase-a-fixture-enabled: ${JOURNEY_PHASE_A_FIXTURE_ENABLED:false}
