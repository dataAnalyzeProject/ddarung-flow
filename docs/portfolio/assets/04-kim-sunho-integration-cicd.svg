<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">김선호의 기술 기여 연결도</title><desc id="desc">데이터 엔지니어링, OCI 데이터 저장, 통합 릴리스, 클라우드 운영의 네 기둥과 main 병합부터 Docker 빌드 푸시까지 이어지는 릴리스 체인을 표시한다.</desc>
  <style>text{font-family:Arial,'Noto Sans KR',sans-serif}.text-main{fill:#102A43}.text-muted{fill:#5C6B7A}.text-white{fill:#FFFFFF}.text-teal{fill:#0F9D8A}.text-blue{fill:#2563EB}.title{font-size:39px;font-weight:800}.sub{font-size:17px}.pillar{font-size:17px;font-weight:800}.item{font-size:14px;font-weight:700}.note{font-size:12px}.gate{font-size:11px;font-weight:700}.chain{font-size:13px;font-weight:800}</style>
  <rect width="1600" height="900" fill="#FFFFFF"/><text x="70" y="82" class="title text-main">김선호 — Technical Contribution</text><text x="70" y="116" class="sub text-muted">Data Engineering · Cloud · Integration · Release</text><text x="70" y="150" class="sub text-muted">팀의 데이터·서비스·운영 결과가 검증 근거까지 이어지도록 연결한 범위입니다.</text>
  <g><rect x="70" y="195" width="340" height="405" rx="16" fill="#F5F9FF"/><rect x="70" y="195" width="340" height="60" rx="16" fill="#2563EB"/><text x="95" y="232" class="pillar text-white">01  DATA ENGINEERING</text><text x="100" y="295" class="item text-main">Realtime APIs</text><path d="M220 303v24" stroke="#2563EB" stroke-width="2"/><text x="100" y="342" class="item text-main">Airflow</text><path d="M220 350v24" stroke="#2563EB" stroke-width="2"/><text x="100" y="389" class="item text-main">Raw</text><path d="M220 397v24" stroke="#2563EB" stroke-width="2"/><text x="100" y="436" class="item text-main">Quality</text><path d="M220 444v24" stroke="#2563EB" stroke-width="2"/><text x="100" y="483" class="item text-main">Curated</text><rect x="95" y="515" width="290" height="62" rx="10" fill="#DCEAFF"/><text x="111" y="541" class="note text-blue">재실행 중복 방지 · 실패 경계</text><text x="111" y="562" class="note text-muted">원천을 바로 정상 데이터로 바꾸지 않음</text></g>
  <g><rect x="430" y="195" width="340" height="405" rx="16" fill="#F2FBF9"/><rect x="430" y="195" width="340" height="60" rx="16" fill="#0F9D8A"/><text x="455" y="232" class="pillar text-white">02  CLOUD DATA</text><text x="460" y="295" class="item text-main">OCI Object Storage</text><rect x="460" y="320" width="86" height="43" rx="9" fill="#FFFFFF"/><rect x="557" y="320" width="86" height="43" rx="9" fill="#FFFFFF"/><rect x="654" y="320" width="86" height="43" rx="9" fill="#FFFFFF"/><text x="477" y="347" class="note text-main">Raw</text><text x="570" y="347" class="note text-main">Curated</text><text x="668" y="347" class="note text-main">Artifact</text><path d="M500 390H700" stroke="#0F9D8A" stroke-width="2"/><text x="460" y="425" class="item text-main">Manifest · Lineage</text><text x="460" y="457" class="item text-main">Checksum · Immutable Upload</text><text x="460" y="510" class="note text-muted">전달 대상·이력·무결성을 별도 근거로 확인</text></g>
  <g><rect x="790" y="195" width="340" height="405" rx="16" fill="#F5F9FF"/><rect x="790" y="195" width="340" height="60" rx="16" fill="#2563EB"/><text x="815" y="232" class="pillar text-white">03  INTEGRATION / RELEASE</text><text x="820" y="290" class="item text-main">Notion Contract → Branch → PR</text><text x="820" y="322" class="item text-main">Changed Path → CI Quality Gates → main</text><text x="820" y="360" class="note text-blue">Changed Path Detection</text><g><rect x="815" y="377" width="140" height="37" rx="8" fill="#FFFFFF"/><rect x="965" y="377" width="140" height="37" rx="8" fill="#FFFFFF"/><rect x="815" y="423" width="140" height="37" rx="8" fill="#FFFFFF"/><rect x="965" y="423" width="140" height="37" rx="8" fill="#FFFFFF"/><rect x="815" y="469" width="290" height="37" rx="8" fill="#FFFFFF"/></g><text x="827" y="400" class="gate text-main">Frontend · npm test / build</text><text x="977" y="400" class="gate text-main">Backend · Gradle test</text><text x="827" y="446" class="gate text-main">Pipeline · pytest</text><text x="977" y="446" class="gate text-main">Inference · unit / compose / build</text><text x="827" y="492" class="gate text-main">Workflow · release flag / actionlint / secret-key guard</text><text x="820" y="548" class="note text-teal">ALL PASS → main merge</text></g>
  <g><rect x="1150" y="195" width="380" height="405" rx="16" fill="#F2FBF9"/><rect x="1150" y="195" width="380" height="60" rx="16" fill="#0F9D8A"/><text x="1175" y="232" class="pillar text-white">04  CLOUD / OPERATIONS</text><text x="1180" y="295" class="item text-main">Docker → OCIR → OCI Staging</text><text x="1180" y="332" class="item text-main">Smoke / Rollback → Runtime Evidence</text><rect x="1180" y="365" width="320" height="112" rx="10" fill="#102A43"/><text x="1200" y="394" class="note text-teal">RUNTIME EVIDENCE · FACTUAL CHECKS</text><text x="1200" y="422" class="note text-white">deployed commit match · backend / inference / postgres running</text><text x="1200" y="447" class="note text-white">restart count · HTTP 5xx / unhandled / DB / inference markers</text><text x="1180" y="523" class="note text-muted">브라우저 수용성은 이 작업과 별도 증거</text></g>
  <rect x="70" y="635" width="1460" height="112" rx="16" fill="#102A43"/><text x="100" y="668" class="chain text-teal">RELEASE HANDOFF — main merge 뒤에도 근거를 끊지 않는다</text><g fill="none" stroke="#7CE0D1" stroke-width="3"><path d="M245 705H440"/><path d="M535 705H730"/><path d="M825 705H1020"/><path d="M1115 705H1310"/></g><g fill="#7CE0D1"><path d="M430 697l12 8-12 8"/><path d="M720 697l12 8-12 8"/><path d="M1010 697l12 8-12 8"/><path d="M1300 697l12 8-12 8"/></g><g><text x="115" y="711" class="chain text-white">main Merge</text><text x="290" y="711" class="chain text-white">Exact SHA Verification</text><text x="570" y="711" class="chain text-white">Stale Candidate Guard</text><text x="850" y="711" class="chain text-white">Changed Image Detection</text><text x="1140" y="711" class="chain text-white">Docker Build / Push</text></g>
  <text x="70" y="822" class="sub text-main">데이터가 들어오는 지점부터 클라우드 저장·서비스 통합·배포 후 검증까지 팀 결과를 연결했습니다.</text><text x="70" y="850" class="note text-muted">범위 경계 — 모델 학습·평가 전체를 개인 구현으로 표기하지 않으며, runtime evidence를 브라우저 acceptance로 바꾸어 주장하지 않습니다.</text>
</svg>
