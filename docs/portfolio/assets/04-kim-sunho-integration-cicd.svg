<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">김선호의 통합 및 릴리스 엔지니어링 흐름</title><desc id="desc">Notion 작업 계약부터 PR, exact SHA guard, OCI staging, runtime evidence, release까지의 근거 기반 흐름을 표시한다.</desc><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#102A43}.cap{font-size:15px;font-weight:800;letter-spacing:2px}.h{font-size:40px;font-weight:800}.t{font-size:16px;font-weight:800}.b{font-size:13px;fill:#5C6B7A}.w{font-size:13px;fill:white}.n{font-size:13px;font-weight:800;fill:#2563EB}</style><rect width="1600" height="900" fill="white"/><text x="80" y="85" class="cap" fill="#0F9D8A">INTEGRATION &amp; RELEASE ENGINEERING</text><text x="80" y="135" class="h">릴리스는 버튼이 아니라, 근거가 이어지는 체인입니다</text><text x="80" y="171" class="b">김선호의 책임은 팀 코드의 개인 소유가 아니라 계약·통합·검증 사실을 연결하는 일입니다.</text>
<g fill="none" stroke="#B8C7D9" stroke-width="3"><path d="M152 335H1448"/><path d="M152 575H1448"/></g><g fill="#2563EB"><path d="M1435 327l13 8-13 8"/><path d="M1435 567l13 8-13 8"/></g>
<g><rect x="80" y="260" width="210" height="150" rx="16" fill="#F5F9FF"/><text x="105" y="298" class="n">01</text><text x="105" y="333" class="t">Notion WBS</text><text x="105" y="358" class="b">범위 · 담당 · 검증 기준</text><rect x="325" y="260" width="210" height="150" rx="16" fill="#F5F9FF"/><text x="350" y="298" class="n">02</text><text x="350" y="333" class="t">Branch → PR</text><text x="350" y="358" class="b">분리 작업 · 제출 근거</text><rect x="570" y="260" width="210" height="150" rx="16" fill="#F5F9FF"/><text x="595" y="298" class="n">03</text><text x="595" y="333" class="t">Changed paths</text><text x="595" y="358" class="b">허용 범위와 diff 확인</text><rect x="815" y="260" width="210" height="150" rx="16" fill="#F5F9FF"/><text x="840" y="298" class="n">04</text><text x="840" y="333" class="t">Quality gates</text><text x="840" y="358" class="b">CI · 보안·워크플로 검증</text><rect x="1060" y="260" width="210" height="150" rx="16" fill="#F5F9FF"/><text x="1085" y="298" class="n">05</text><text x="1085" y="333" class="t">main merge</text><text x="1085" y="358" class="b">병합 사실은 GitHub 기준</text><rect x="1305" y="260" width="210" height="150" rx="16" fill="#DDF7F1"/><text x="1330" y="298" class="n">06</text><text x="1330" y="333" class="t">exact SHA guard</text><text x="1330" y="358" class="b">stale candidate 중단</text></g>
<g><rect x="80" y="500" width="210" height="150" rx="16" fill="#F2FBF9"/><text x="105" y="538" class="n">07</text><text x="105" y="573" class="t">Changed images</text><text x="105" y="598" class="b">필요한 Docker image 선택</text><rect x="325" y="500" width="210" height="150" rx="16" fill="#F2FBF9"/><text x="350" y="538" class="n">08</text><text x="350" y="573" class="t">Docker push</text><text x="350" y="598" class="b">선택된 image build/push</text><rect x="570" y="500" width="210" height="150" rx="16" fill="#F2FBF9"/><text x="595" y="538" class="n">09</text><text x="595" y="573" class="t">OCIR</text><text x="595" y="598" class="b">이미지 레지스트리</text><rect x="815" y="500" width="210" height="150" rx="16" fill="#F2FBF9"/><text x="840" y="538" class="n">10</text><text x="840" y="573" class="t">OCI Staging</text><text x="840" y="598" class="b">배포 candidate 적용</text><rect x="1060" y="500" width="210" height="150" rx="16" fill="#FFF8E7"/><text x="1085" y="538" class="n">11</text><text x="1085" y="573" class="t">Smoke · rollback</text><text x="1085" y="598" class="b">실패 시 이전 release 복원</text><rect x="1305" y="500" width="210" height="150" rx="16" fill="#DDF7F1"/><text x="1330" y="538" class="n">12</text><text x="1330" y="573" class="t">Runtime evidence</text><text x="1330" y="598" class="b">확인 뒤 release 기록</text></g>
<rect x="80" y="710" width="1435" height="125" rx="18" fill="#102A43"/><text x="108" y="748" class="cap" fill="#7CE0D1">RUNTIME EVIDENCE CARD · FACTUAL CHECKS</text><text x="108" y="782" class="w">deployed commit match  ·  frontend / backend / inference / postgres healthy  ·  restart counts  ·  HTTP 5xx &amp; key error logs checked</text><text x="108" y="810" class="w">A successful job alone is not re-labeled as browser acceptance; each evidence layer remains distinct.</text></svg>
