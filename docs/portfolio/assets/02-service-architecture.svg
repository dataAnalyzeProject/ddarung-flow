<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">따라가요 서비스 아키텍처</title><desc id="desc">외부 소스, Data ML, Spring 서비스, Consumer와 Operations 표면을 계층으로 표시한다.</desc><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#102A43}.cap{font-size:15px;font-weight:800;letter-spacing:1.8px}.h{font-size:40px;font-weight:800}.sub{font-size:17px;fill:#5C6B7A}.t{font-size:16px;font-weight:700}.b{font-size:14px;fill:#5C6B7A}.s{font-size:13px;fill:#5C6B7A}</style><rect width="1600" height="900" fill="white"/><text x="92" y="88" class="cap" fill="#0F9D8A">SERVICE ARCHITECTURE</text><text x="92" y="138" class="h">외부 데이터에서 사용자 선택까지의 책임 경계</text><text x="92" y="174" class="sub">경로·맥락·품질·추론·사용자 화면을 하나의 모델 주장으로 섞지 않습니다.</text>
