<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">따라가요 팀 협업과 통합 레인</title><desc id="desc">5명의 동등한 역할 카드와 계약에서 릴리스 증거로 이어지는 통합 레인을 보여 준다.</desc><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#102A43}.cap{font-size:15px;font-weight:800;letter-spacing:2px}.h{font-size:40px;font-weight:800}.t{font-size:19px;font-weight:800}.r{font-size:15px;font-weight:700;fill:#2563EB}.b{font-size:14px;fill:#5C6B7A}.s{font-size:13px;fill:#5C6B7A}</style><rect width="1600" height="900" fill="white"/><text x="85" y="86" class="cap" fill="#0F9D8A">TEAM COLLABORATION</text><text x="85" y="136" class="h">분리된 책임, 하나의 검증 가능한 결과</text><text x="85" y="172" class="b">카드는 위계가 아니라 각자가 주로 소유한 책임 경계입니다.</text>
<g><rect x="85" y="230" width="280" height="330" rx="18" fill="#F5F9FF"/><rect x="385" y="230" width="280" height="330" rx="18" fill="#F2FBF9"/><rect x="685" y="230" width="280" height="330" rx="18" fill="#F5F9FF"/><rect x="985" y="230" width="280" height="330" rx="18" fill="#F2FBF9"/><rect x="1285" y="230" width="230" height="330" rx="18" fill="#F5F9FF"/></g>
<g><circle cx="125" cy="275" r="18" fill="#2563EB"/><text x="118" y="281" class="b" fill="white">01</text><text x="115" y="328" class="t">김선호</text><text x="115" y="358" class="r">PM / Integration / DevOps</text><text x="115" y="408" class="b">WBS · 작업 계약 · 우선순위</text><text x="115" y="435" class="b">PR 기준선 검토와 통합</text><text x="115" y="462" class="b">CI/CD · release evidence</text></g>
<g><circle cx="425" cy="275" r="18" fill="#0F9D8A"/><text x="418" y="281" class="b" fill="white">02</text><text x="415" y="328" class="t">황준형</text><text x="415" y="358" class="r" fill="#0F9D8A">Data / ML</text><text x="415" y="408" class="b">수집 · 품질 · 결합 검증</text><text x="415" y="435" class="b">H1–H4 · 수량 기준선</text><text x="415" y="462" class="b">모델 비교 · 평가 artifact</text></g>
<g><circle cx="725" cy="275" r="18" fill="#2563EB"/><text x="718" y="281" class="b" fill="white">03</text><text x="715" y="328" class="t">선경원</text><text x="715" y="358" class="r">Backend / API / DB</text><text x="715" y="408" class="b">OAuth · 도착시각 상태</text><text x="715" y="435" class="b">예측 · 지도 · 주변 API</text><text x="715" y="462" class="b">DB와 서비스 계약</text></g>
<g><circle cx="1025" cy="275" r="18" fill="#0F9D8A"/><text x="1018" y="281" class="b" fill="white">04</text><text x="1015" y="328" class="t">유제훈</text><text x="1015" y="358" class="r" fill="#0F9D8A">Frontend / Admin</text><text x="1015" y="408" class="b">로그인 · 입력 복원</text><text x="1015" y="435" class="b">Data/Export · ModelOps</text><text x="1015" y="462" class="b">Premium 보조 UI</text></g>
<g><circle cx="1325" cy="275" r="18" fill="#2563EB"/><text x="1318" y="281" class="b" fill="white">05</text><text x="1315" y="328" class="t">김로운</text><text x="1315" y="358" class="r">Frontend / Consumer</text><text x="1315" y="408" class="b">Consumer 결과 · 상세 UI</text><text x="1315" y="435" class="b">AdminShell · 권한/감사</text><text x="1315" y="462" class="b">관리자 adapter 통합</text></g>
<rect x="85" y="635" width="1430" height="145" rx="18" fill="#102A43"/><text x="115" y="680" class="cap" fill="#7CE0D1">KIM SUNHO · CROSS-CUTTING RELEASE LANE</text><g stroke="#5E85C7" stroke-width="2" fill="none"><path d="M132 722H1458"/></g><g><circle cx="190" cy="722" r="17" fill="#0F9D8A"/><circle cx="490" cy="722" r="17" fill="#2563EB"/><circle cx="800" cy="722" r="17" fill="#0F9D8A"/><circle cx="1110" cy="722" r="17" fill="#2563EB"/><circle cx="1400" cy="722" r="17" fill="#0F9D8A"/></g><g class="b" style="fill:white"><text x="150" y="758" style="fill:white">작업 계약</text><text x="445" y="758" style="fill:white">PR · 기준선 검토</text><text x="755" y="758" style="fill:white">CI/CD</text><text x="1065" y="758" style="fill:white">Staging 검증</text><text x="1350" y="758" style="fill:white">인수 근거</text></g><text x="85" y="840" class="s">COLLABORATION PRINCIPLE — 데이터·API·화면·운영 증거는 PR과 계약에서 만나며, 단일 개인의 구현 성과로 합산하지 않습니다.</text></svg>
