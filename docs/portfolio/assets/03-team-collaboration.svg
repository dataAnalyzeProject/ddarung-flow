<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">따라가요 팀 협업과 통합 레인</title><desc id="desc">동일한 크기의 다섯 역할 카드와 작업 계약에서 릴리스 증거까지 이어지는 협업 레인을 보여 준다.</desc>
  <style>text{font-family:Arial,'Noto Sans KR',sans-serif}.text-main{fill:#102A43}.text-muted{fill:#5C6B7A}.text-white{fill:#FFFFFF}.text-teal{fill:#0F9D8A}.text-blue{fill:#2563EB}.title{font-size:40px;font-weight:800}.role{font-size:15px;font-weight:800}.name{font-size:21px;font-weight:800}.body{font-size:14px}.small{font-size:13px}.lane{font-size:14px;font-weight:800}</style>
  <rect width="1600" height="900" fill="#FFFFFF"/><text x="85" y="106" class="title text-main">분리된 책임, 하나의 검증 가능한 결과</text><text x="85" y="145" class="body text-muted">카드는 위계가 아니라 각자가 주로 소유한 책임 경계입니다.</text>
  <g><rect x="85" y="220" width="270" height="330" rx="16" fill="#F5F9FF"/><rect x="375" y="220" width="270" height="330" rx="16" fill="#F2FBF9"/><rect x="665" y="220" width="270" height="330" rx="16" fill="#F5F9FF"/><rect x="955" y="220" width="270" height="330" rx="16" fill="#F2FBF9"/><rect x="1245" y="220" width="270" height="330" rx="16" fill="#F5F9FF"/></g>
  <g><circle cx="125" cy="264" r="18" fill="#2563EB"/><text x="118" y="270" class="small text-white">01</text><text x="115" y="324" class="name text-main">김선호</text><text x="115" y="356" class="role text-blue">PM / Integration / DevOps</text><text x="115" y="410" class="body text-muted">작업 계약 · 우선순위</text><text x="115" y="438" class="body text-muted">PR 기준선 검토 · 통합</text><text x="115" y="466" class="body text-muted">CI/CD · 릴리스 근거</text></g>
  <g><circle cx="415" cy="264" r="18" fill="#0F9D8A"/><text x="408" y="270" class="small text-white">02</text><text x="405" y="324" class="name text-main">황준형</text><text x="405" y="356" class="role text-teal">Data / ML</text><text x="405" y="410" class="body text-muted">수집 · 품질 · 결합 검증</text><text x="405" y="438" class="body text-muted">H1–H4 · 수량 기준선</text><text x="405" y="466" class="body text-muted">모델 비교 · 평가 artifact</text></g>
  <g><circle cx="705" cy="264" r="18" fill="#2563EB"/><text x="698" y="270" class="small text-white">03</text><text x="695" y="324" class="name text-main">선경원</text><text x="695" y="356" class="role text-blue">Backend / API / DB</text><text x="695" y="410" class="body text-muted">OAuth · 도착시각 상태</text><text x="695" y="438" class="body text-muted">예측 · 지도 · 주변 API</text><text x="695" y="466" class="body text-muted">DB와 서비스 계약</text></g>
  <g><circle cx="995" cy="264" r="18" fill="#0F9D8A"/><text x="988" y="270" class="small text-white">04</text><text x="985" y="324" class="name text-main">유제훈</text><text x="985" y="356" class="role text-teal">Frontend / 관리자 시각화</text><text x="985" y="410" class="body text-muted">로그인 · 입력 복원</text><text x="985" y="438" class="body text-muted">Data/Export · ModelOps</text><text x="985" y="466" class="body text-muted">Premium 보조 UI</text></g>
  <g><circle cx="1285" cy="264" r="18" fill="#2563EB"/><text x="1278" y="270" class="small text-white">05</text><text x="1275" y="324" class="name text-main">김로운</text><text x="1275" y="356" class="role text-blue">Frontend / Consumer / Admin UI</text><text x="1275" y="410" class="body text-muted">Consumer 결과 · 상세 UI</text><text x="1275" y="438" class="body text-muted">AdminShell · 권한/감사</text><text x="1275" y="466" class="body text-muted">관리자 adapter 통합</text></g>
  <rect x="85" y="625" width="1430" height="150" rx="16" fill="#102A43"/><text x="115" y="670" class="lane text-teal">김선호 · CROSS-CUTTING RELEASE LANE</text><path d="M155 715H1445" fill="none" stroke="#5E85C7" stroke-width="3"/><g fill="#0F9D8A"><circle cx="185" cy="715" r="16"/><circle cx="490" cy="715" r="16"/><circle cx="800" cy="715" r="16"/><circle cx="1110" cy="715" r="16"/><circle cx="1410" cy="715" r="16"/></g><g><text x="130" y="752" class="body text-white">작업 계약</text><text x="424" y="752" class="body text-white">PR · 기준선 검토</text><text x="764" y="752" class="body text-white">CI/CD</text><text x="1058" y="752" class="body text-white">Staging 검증</text><text x="1358" y="752" class="body text-white">인수 근거</text></g>
  <text x="85" y="840" class="small text-muted">COLLABORATION PRINCIPLE — 데이터·API·화면·운영 증거는 계약과 PR에서 만나며, 단일 개인의 구현 성과로 합산하지 않습니다.</text>
</svg>
