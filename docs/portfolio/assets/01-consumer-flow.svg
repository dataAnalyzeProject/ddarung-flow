<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">따라가요 Consumer 도착시점 대여소 선택 흐름</title><desc id="desc">입력, 도착시각 기준 예측, 대여소 비교와 선택의 세 단계를 보여 준다. TOO SOON에서는 최신 현재 재고만 보인다고 명시한다.</desc>
  <style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#102A43}.cap{font-size:16px;font-weight:700;letter-spacing:2px}.h{font-size:42px;font-weight:800}.sub{font-size:18px;fill:#5C6B7A}.label{font-size:17px;font-weight:700}.body{font-size:15px;fill:#5C6B7A}.small{font-size:14px;fill:#5C6B7A}.n{font-size:14px;font-weight:800;fill:#2563EB}</style>
  <rect width="1600" height="900" fill="#fff"/><rect x="70" y="65" width="9" height="105" rx="4" fill="#0F9D8A"/><text x="105" y="105" class="cap" fill="#0F9D8A">CONSUMER DECISION FLOW</text><text x="105" y="155" class="h">도착 시점에, 더 나은 대여소를 고르다</text><text x="105" y="193" class="sub">현재 재고를 출발점으로 삼되, 도착 ETA와 필요 수량을 함께 비교합니다.</text>
  <path d="M116 280H1484" stroke="#D7E2F0" stroke-width="2"/>
  <g><rect x="100" y="250" width="390" height="500" rx="18" fill="#F5F9FF"/><rect x="100" y="250" width="390" height="76" rx="18" fill="#2563EB"/><text x="132" y="298" class="cap" fill="white">01  INPUT</text><text x="132" y="365" class="label">여정 조건을 정확히 입력</text>
  <circle cx="146" cy="424" r="17" fill="#DCEAFF"/><text x="140" y="430" class="n">A</text><text x="180" y="419" class="label">출발지 · 목적지</text><text x="180" y="444" class="body">지도와 장소 검색으로 설정</text>
  <circle cx="146" cy="510" r="17" fill="#DCEAFF"/><text x="140" y="516" class="n">B</text><text x="180" y="505" class="label">도착 시각 · 이동수단</text><text x="180" y="530" class="body">경로 계산의 기준을 고정</text>
  <circle cx="146" cy="596" r="17" fill="#DCEAFF"/><text x="140" y="602" class="n">C</text><text x="180" y="591" class="label">필요 수량 1–5대</text><text x="180" y="616" class="body">후보 비교에 함께 반영</text></g>
  <path d="M510 500H565" stroke="#2563EB" stroke-width="4" fill="none"/><path d="M553 488l14 12-14 12" fill="none" stroke="#2563EB" stroke-width="4"/>
  <g><rect x="590" y="250" width="420" height="500" rx="18" fill="#F2FBF9"/><rect x="590" y="250" width="420" height="76" rx="18" fill="#0F9D8A"/><text x="622" y="298" class="cap" fill="white">02  PREDICTION</text><text x="622" y="365" class="label">도착시각을 계산하고 후보를 읽기</text>
  <rect x="622" y="400" width="356" height="75" rx="12" fill="white" stroke="#CDECE5"/><text x="646" y="431" class="label">경로 · 예상 도착시각(ETA)</text><text x="646" y="455" class="body">목적지 주변 후보를 탐색</text>
  <rect x="622" y="495" width="356" height="75" rx="12" fill="white" stroke="#CDECE5"/><text x="646" y="526" class="label">로그인 후 보호된 예측 실행</text><text x="646" y="550" class="body">H1–H4 지원 구간을 확인</text>
  <rect x="622" y="590" width="356" height="112" rx="12" fill="#FFF8E7" stroke="#F2D48C"/><text x="646" y="623" class="label">TOO_SOON</text><text x="646" y="648" class="body">지원 horizon이 아직 열리지 않음</text><text x="646" y="675" class="body">확률 대신 최신 현재 재고 + 안내</text></g>
  <path d="M1030 500H1085" stroke="#0F9D8A" stroke-width="4" fill="none"/><path d="M1073 488l14 12-14 12" fill="none" stroke="#0F9D8A" stroke-width="4"/>
  <g><rect x="1110" y="250" width="390" height="500" rx="18" fill="#F5F9FF"/><rect x="1110" y="250" width="390" height="76" rx="18" fill="#102A43"/><text x="1142" y="298" class="cap" fill="white">03  DECISION</text><text x="1142" y="365" class="label">정보를 나란히 놓고 선택</text>
  <rect x="1142" y="400" width="326" height="76" rx="12" fill="white" stroke="#D7E2F0"/><text x="1166" y="432" class="label">대여 가능성 상태</text><text x="1166" y="456" class="body">도착 시점 기준으로 읽기</text>
  <rect x="1142" y="495" width="326" height="76" rx="12" fill="white" stroke="#D7E2F0"/><text x="1166" y="527" class="label">현재 재고 · 거리 · 시간</text><text x="1166" y="551" class="body">같은 숫자처럼 섞지 않기</text>
  <rect x="1142" y="590" width="326" height="76" rx="12" fill="#DDF7F1"/><text x="1166" y="622" class="label">사용자가 대여소 선택</text><text x="1166" y="646" class="body">대안도 함께 비교</text></g>
  <text x="105" y="830" class="small">FACT NOTE — 현재 재고와 미래 대여 가능성은 기준 시각과 출처를 분리해 표시합니다.</text><circle cx="1455" cy="823" r="7" fill="#0F9D8A"/><text x="1470" y="829" class="small">따라가요</text>
</svg>
