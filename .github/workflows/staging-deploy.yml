name: Staging CD

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROLLBACK_TEST to verify automatic rollback on OCI staging
        required: true
        type: string
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: oci-staging-deploy
  cancel-in-progress: false

jobs:
  build-images:
    name: build-and-push-${{ matrix.component }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: oci-staging
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - component: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - component: inference
            context: ./infra/inference
            dockerfile: ./infra/inference/Dockerfile
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
      OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
      OCI_REPOSITORY: ${{ vars.OCI_REPOSITORY }}
      STAGING_PUBLIC_URL: ${{ vars.STAGING_PUBLIC_URL }}
      KAKAO_MAP_APP_KEY: ${{ vars.KAKAO_MAP_APP_KEY }}

    steps:
      - name: Check required image configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in OCI_REGISTRY OCI_NAMESPACE OCI_REPOSITORY STAGING_PUBLIC_URL KAKAO_MAP_APP_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Required staging configuration is missing: $name" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OCI_REGISTRY" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$OCI_NAMESPACE" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$OCI_REPOSITORY" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$STAGING_PUBLIC_URL" =~ ^https://[A-Za-z0-9.:-]+$ ]]

      - name: Check out the successful main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Verify commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.OCI_REGISTRY }}/${{ env.OCI_NAMESPACE }}/${{ env.OCI_REPOSITORY }}/${{ matrix.component }}:${{ env.DEPLOY_SHA }}
          build-args: |
            ${{ matrix.component == 'frontend' && format('REACT_APP_API_BASE_URL={0}', env.STAGING_PUBLIC_URL) || '' }}
            ${{ matrix.component == 'frontend' && format('REACT_APP_KAKAO_MAP_APP_KEY={0}', env.KAKAO_MAP_APP_KEY) || '' }}
          cache-from: type=gha,scope=staging-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.component }}

  deploy:
    name: deploy-oci-staging
    needs: build-images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: oci-staging
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
      OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
      OCI_REPOSITORY: ${{ vars.OCI_REPOSITORY }}
      STAGING_PUBLIC_URL: ${{ vars.STAGING_PUBLIC_URL }}
      REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR }}
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}

    steps:
      - name: Check required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in OCI_REGISTRY OCI_NAMESPACE OCI_REPOSITORY STAGING_PUBLIC_URL REMOTE_APP_DIR SSH_HOST SSH_USER; do
            if [ -z "${!name:-}" ]; then
              echo "Required staging configuration is missing: $name" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OCI_REGISTRY" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$OCI_NAMESPACE" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$OCI_REPOSITORY" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$STAGING_PUBLIC_URL" =~ ^https://[A-Za-z0-9.:-]+$ ]]
          [[ "$REMOTE_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]

      - name: Check out the successful main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Verify commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_staging" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_staging" >/dev/null
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Prepare immutable release files
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ vars.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          AIRKOREA_SERVICE_KEY: ${{ secrets.AIRKOREA_SERVICE_KEY }}
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          NAVER_CLIENT_ID: ${{ vars.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          MODEL_POINTER_KEY: ${{ vars.MODEL_POINTER_KEY }}
          MODEL_POINTER_SHA256: ${{ vars.MODEL_POINTER_SHA256 }}
        run: |
          set -euo pipefail
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET NAVER_CLIENT_ID NAVER_CLIENT_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Required OAuth configuration is missing: $name" >&2
              exit 1
            fi
            if [[ ! "$value" =~ ^[A-Za-z0-9._~+/-]+$ ]]; then
              echo "OAuth configuration contains unsupported characters: $name" >&2
              exit 1
            fi
          done
          for name in KAKAO_REST_API_KEY AIRKOREA_SERVICE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Required external API configuration is missing: $name" >&2
              exit 1
            fi
          done

          image_base="$OCI_REGISTRY/$OCI_NAMESPACE/$OCI_REPOSITORY"
          {
            printf 'FRONTEND_IMAGE=%s/frontend:%s\n' "$image_base" "$DEPLOY_SHA"
            printf 'BACKEND_IMAGE=%s/backend:%s\n' "$image_base" "$DEPLOY_SHA"
            printf 'INFERENCE_IMAGE=%s/inference:%s\n' "$image_base" "$DEPLOY_SHA"
            printf 'REACT_APP_API_BASE_URL=%s\n' "$STAGING_PUBLIC_URL"
            printf 'DEPLOYED_COMMIT=%s\n' "$DEPLOY_SHA"
            printf 'OCI_OBJECT_NAMESPACE=nrzeviuvbcrd\n'
            printf 'MODEL_BUCKET=ddarung-flow-bucket\n'
            printf 'MODEL_OBJECT_KEY=models/data-3.1/2f2ece729fd4b03954212d2fcc2ece4cd07110c947fae1dfc0c7ba29cde34db9/model_winner.joblib\n'
            printf 'MODEL_SHA256=2f2ece729fd4b03954212d2fcc2ece4cd07110c947fae1dfc0c7ba29cde34db9\n'
            if [ -n "${MODEL_POINTER_KEY:-}" ] && [ -n "${MODEL_POINTER_SHA256:-}" ]; then
              printf 'MODEL_POINTER_KEY=%s\n' "$MODEL_POINTER_KEY"
              printf 'MODEL_POINTER_SHA256=%s\n' "$MODEL_POINTER_SHA256"
            fi
          } > release.candidate.env
          umask 077
          {
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'KAKAO_CLIENT_ID=%s\n' "$KAKAO_CLIENT_ID"
            printf 'KAKAO_CLIENT_SECRET=%s\n' "$KAKAO_CLIENT_SECRET"
            printf 'KAKAO_REST_API_KEY=%s\n' "$KAKAO_REST_API_KEY"
            printf 'AIRKOREA_SERVICE_KEY=%s\n' "$AIRKOREA_SERVICE_KEY"
            printf 'KMA_SERVICE_KEY=%s\n' "$KMA_SERVICE_KEY"
            printf 'NAVER_CLIENT_ID=%s\n' "$NAVER_CLIENT_ID"
            printf 'NAVER_CLIENT_SECRET=%s\n' "$NAVER_CLIENT_SECRET"
          } > oauth.candidate.env
          chmod 600 oauth.candidate.env

      - name: Upload candidate release
        shell: bash
        run: |
          set -euo pipefail
          target="$SSH_USER@$SSH_HOST"
          ssh -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p '$REMOTE_APP_DIR'"
          scp -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes infra/staging/docker-compose.yaml "$target:$REMOTE_APP_DIR/docker-compose.yaml.candidate"
          scp -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes release.candidate.env "$target:$REMOTE_APP_DIR/release.candidate.env"
          scp -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes oauth.candidate.env "$target:$REMOTE_APP_DIR/oauth.candidate.env"

      - name: Deploy and automatically roll back on failed smoke
        shell: bash
        run: |
          set -euo pipefail
          target="$SSH_USER@$SSH_HOST"
          ssh -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
            "REMOTE_APP_DIR='$REMOTE_APP_DIR' STAGING_PUBLIC_URL='$STAGING_PUBLIC_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_APP_DIR"
          test -f .env
          chmod 600 .env release.candidate.env oauth.candidate.env

          rollback() {
            echo "Staging deployment failed; restoring the previous release." >&2
            if [ -f release.previous.env ] && [ -f oauth.previous.env ] && [ -f docker-compose.previous.yaml ]; then
              cp release.previous.env release.env
              cp oauth.previous.env oauth.env
              cp docker-compose.previous.yaml docker-compose.yaml
              chmod 600 release.env oauth.env
              docker compose --env-file .env --env-file oauth.env --env-file release.env -f docker-compose.yaml pull
              docker compose --env-file .env --env-file oauth.env --env-file release.env -f docker-compose.yaml up -d --no-build --remove-orphans
            else
              echo "No previous release exists for automatic rollback." >&2
            fi
          }
          trap rollback ERR

          if [ -f release.env ]; then cp release.env release.previous.env; fi
          if [ -f oauth.env ]; then cp oauth.env oauth.previous.env; else cp oauth.candidate.env oauth.previous.env; fi
          if [ -f docker-compose.yaml ]; then cp docker-compose.yaml docker-compose.previous.yaml; fi
          mv release.candidate.env release.env
          mv oauth.candidate.env oauth.env
          mv docker-compose.yaml.candidate docker-compose.yaml
          chmod 600 release.env oauth.env

          docker compose --env-file .env --env-file oauth.env --env-file release.env -f docker-compose.yaml config --quiet
          docker compose --env-file .env --env-file oauth.env --env-file release.env -f docker-compose.yaml pull frontend backend postgres inference
          docker compose --env-file .env --env-file oauth.env --env-file release.env -f docker-compose.yaml up -d --no-build --remove-orphans

          staging_healthy=false
          for attempt in $(seq 1 18); do
            postgres_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ddarung-flow-staging-postgres-1 2>/dev/null || true)
            inference_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ddarung-flow-staging-inference-1 2>/dev/null || true)
            frontend_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/ || true)
            proxy_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/v1/auth/me || true)
            public_frontend_code=$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_PUBLIC_URL/" || true)
            public_proxy_code=$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_PUBLIC_URL/api/v1/auth/me" || true)
            if [ "$postgres_status" = healthy ] && [ "$inference_status" = healthy ] && [ "$frontend_code" = 200 ] && [[ "$proxy_code" =~ ^(200|401|403)$ ]] && [ "$public_frontend_code" = 200 ] && [[ "$public_proxy_code" =~ ^(200|401|403)$ ]]; then
              staging_healthy=true
              break
            fi
            sleep 5
          done
          if [ "$staging_healthy" != true ]; then
            echo "Staging health checks did not pass before timeout." >&2
            false
          fi

          for provider in google kakao naver; do
            authorization_url=$(curl -sS -o /dev/null -w '%{redirect_url}' "$STAGING_PUBLIC_URL/oauth2/authorization/$provider")
            if ! AUTHORIZATION_URL="$authorization_url" EXPECTED_CALLBACK="$STAGING_PUBLIC_URL/login/oauth2/code/$provider" python3 -c 'import os, sys, urllib.parse; query = urllib.parse.parse_qs(urllib.parse.urlsplit(os.environ["AUTHORIZATION_URL"]).query); sys.exit(0 if query.get("redirect_uri") == [os.environ["EXPECTED_CALLBACK"]] else 1)'; then
              echo "OAuth HTTPS callback verification failed: $provider" >&2
              false
            fi
          done

          trap - ERR
          docker compose --env-file .env --env-file oauth.env --env-file release.env -f docker-compose.yaml ps
          echo "Public staging and OAuth HTTPS callback verification passed."
          REMOTE

  verify-automatic-rollback:
    name: verify-automatic-rollback
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'ROLLBACK_TEST'
    runs-on: ubuntu-latest
    environment: oci-staging
    env:
      STAGING_PUBLIC_URL: ${{ vars.STAGING_PUBLIC_URL }}
      REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR }}
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}

    steps:
      - name: Check rollback test configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = ROLLBACK_TEST
          for name in STAGING_PUBLIC_URL REMOTE_APP_DIR SSH_HOST SSH_USER; do
            if [ -z "${!name:-}" ]; then
              echo "Required staging configuration is missing: $name" >&2
              exit 1
            fi
          done
          [[ "$STAGING_PUBLIC_URL" =~ ^https://[A-Za-z0-9.:-]+$ ]]
          [[ "$REMOTE_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_staging" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_staging" >/dev/null
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Inject failure and invoke automatic rollback
        id: inject
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target="$SSH_USER@$SSH_HOST"
          ssh -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
            "REMOTE_APP_DIR='$REMOTE_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_APP_DIR"
          for file in .env release.env oauth.env docker-compose.yaml release.previous.env oauth.previous.env docker-compose.previous.yaml; do
            test -f "$file"
          done

          current_sha=$(sed -n 's/^DEPLOYED_COMMIT=//p' release.env)
          previous_sha=$(sed -n 's/^DEPLOYED_COMMIT=//p' release.previous.env)
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$current_sha" != "$previous_sha"
          printf 'EXPECTED_ROLLBACK_SHA=%s\n' "$previous_sha" > rollback-test.expected.env
          chmod 600 rollback-test.expected.env

          rollback() {
            echo "ROLLBACK_TEST_INJECTED: restoring previous release $previous_sha" >&2
            cp release.previous.env release.env
            cp oauth.previous.env oauth.env
            cp docker-compose.previous.yaml docker-compose.yaml
            chmod 600 release.env oauth.env
            docker compose --env-file .env --env-file oauth.env --env-file release.env -f docker-compose.yaml pull
            docker compose --env-file .env --env-file oauth.env --env-file release.env -f docker-compose.yaml up -d --no-build --remove-orphans
          }
          trap rollback ERR

          echo "ROLLBACK_TEST_TRIGGER: intentional failure after preserving current=$current_sha previous=$previous_sha"
          false
          REMOTE

      - name: Verify restored release and smoke
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.inject.outcome }}" = failure
          target="$SSH_USER@$SSH_HOST"
          ssh -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
            "REMOTE_APP_DIR='$REMOTE_APP_DIR' STAGING_PUBLIC_URL='$STAGING_PUBLIC_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_APP_DIR"
          test -f rollback-test.expected.env
          expected_sha=$(sed -n 's/^EXPECTED_ROLLBACK_SHA=//p' rollback-test.expected.env)
          deployed_sha=$(sed -n 's/^DEPLOYED_COMMIT=//p' release.env)
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$deployed_sha" = "$expected_sha"
          docker compose --env-file .env --env-file oauth.env --env-file release.env -f docker-compose.yaml config --quiet

          restored_healthy=false
          for attempt in $(seq 1 18); do
            postgres_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ddarung-flow-staging-postgres-1 2>/dev/null || true)
            frontend_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/ || true)
            proxy_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/v1/auth/me || true)
            public_frontend_code=$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_PUBLIC_URL/" || true)
            public_proxy_code=$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_PUBLIC_URL/api/v1/auth/me" || true)
            if [ "$postgres_status" = healthy ] && [ "$frontend_code" = 200 ] && [[ "$proxy_code" =~ ^(200|401|403)$ ]] && [ "$public_frontend_code" = 200 ] && [[ "$public_proxy_code" =~ ^(200|401|403)$ ]]; then
              restored_healthy=true
              break
            fi
            sleep 5
          done
          test "$restored_healthy" = true

          for provider in google kakao naver; do
            authorization_url=$(curl -sS -o /dev/null -w '%{redirect_url}' "$STAGING_PUBLIC_URL/oauth2/authorization/$provider")
            AUTHORIZATION_URL="$authorization_url" EXPECTED_CALLBACK="$STAGING_PUBLIC_URL/login/oauth2/code/$provider" python3 -c 'import os, sys, urllib.parse; query = urllib.parse.parse_qs(urllib.parse.urlsplit(os.environ["AUTHORIZATION_URL"]).query); sys.exit(0 if query.get("redirect_uri") == [os.environ["EXPECTED_CALLBACK"]] else 1)'
          done

          rm -f rollback-test.expected.env
          echo "ROLLBACK_VERIFICATION_PASSED: restored=$deployed_sha frontend=$frontend_code proxy=$proxy_code postgres=$postgres_status"
          REMOTE
