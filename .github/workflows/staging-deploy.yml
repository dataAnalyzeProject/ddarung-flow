name: Staging CD

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type ROLLBACK_TEST to verify automatic rollback on OCI staging
        required: true
        type: string
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: oci-staging-deploy
  cancel-in-progress: false

jobs:
  detect-changes:
    name: detect-image-changes
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: oci-staging
    outputs:
      latest: ${{ steps.candidate.outputs.latest }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      frontend_tag: ${{ steps.matrix.outputs.frontend_tag }}
      backend_tag: ${{ steps.matrix.outputs.backend_tag }}
      inference_tag: ${{ steps.matrix.outputs.inference_tag }}
      inventory_refresher_tag: ${{ steps.matrix.outputs.inventory_refresher_tag }}
      journey_enabled: ${{ steps.journey_flag.outputs.value }}
      journey_ai_enabled: ${{ steps.journey_ai_flag.outputs.value }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
      OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
      OCI_REPOSITORY: ${{ vars.OCI_REPOSITORY }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify deployment candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          git rev-parse "$DEPLOY_SHA^" >/dev/null
          if [ "$(git rev-parse origin/main)" = "$DEPLOY_SHA" ]; then
            echo 'latest=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale build candidate $DEPLOY_SHA; main already advanced."
            echo 'latest=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Read versioned Journey release flag
        id: journey_flag
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_flag_lines < infra/staging/journey-release-flags.env
          if [ "${#release_flag_lines[@]}" -ne 1 ]; then
            echo 'Journey release flag must contain exactly one line.' >&2
            exit 1
          fi
          case "${release_flag_lines[0]}" in
            JOURNEY_ENABLED=true) journey_enabled=true ;;
            JOURNEY_ENABLED=false) journey_enabled=false ;;
            *)
              echo 'JOURNEY_ENABLED must be exactly true or false without whitespace.' >&2
              exit 1
              ;;
          esac
          printf 'value=%s\n' "$journey_enabled" >> "$GITHUB_OUTPUT"

      - name: Read versioned Journey AI release flag
        id: journey_ai_flag
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_flag_lines < infra/staging/journey-ai-release-flags.env
          if [ "${#release_flag_lines[@]}" -ne 1 ]; then
            echo 'Journey AI release flag must contain exactly one line.' >&2
            exit 1
          fi
          case "${release_flag_lines[0]}" in
            JOURNEY_AI_ENABLED=true) journey_ai_enabled=true ;;
            JOURNEY_AI_ENABLED=false) journey_ai_enabled=false ;;
            *)
              echo 'JOURNEY_AI_ENABLED must be exactly true or false without whitespace.' >&2
              exit 1
              ;;
          esac
          printf 'value=%s\n' "$journey_ai_enabled" >> "$GITHUB_OUTPUT"

      - name: Log in to OCIR
        if: steps.candidate.outputs.latest == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - id: matrix
        name: Select image tags and build matrix
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.candidate.outputs.latest }}" != true ]; then
            echo 'build_matrix=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          parent_sha=$(git rev-parse "$DEPLOY_SHA^")
          image_base="$OCI_REGISTRY/$OCI_NAMESPACE/$OCI_REPOSITORY"
          components=(frontend backend inference inventory-refresher)
          contexts=(./frontend ./backend ./infra/inference .)
          dockerfiles=(./frontend/Dockerfile ./backend/Dockerfile ./infra/inference/Dockerfile ./infra/inventory-refresher/Dockerfile)
          paths=(frontend backend infra/inference pipeline)
          matrix='[]'

          for index in "${!components[@]}"; do
            component=${components[$index]}
            context=${contexts[$index]}
            dockerfile=${dockerfiles[$index]}
            path=${paths[$index]}
            tag="$parent_sha"
            changed=false
            if ! git diff --quiet "$parent_sha" "$DEPLOY_SHA" -- "$path"; then
              changed=true
              tag="$DEPLOY_SHA"
            elif [ "$component" = frontend ] && ! git diff --quiet "$parent_sha" "$DEPLOY_SHA" -- infra/staging/journey-release-flags.env; then
              echo "Journey release flag changed; rebuilding frontend for $DEPLOY_SHA."
              changed=true
              tag="$DEPLOY_SHA"
            elif ! docker manifest inspect "$image_base/$component:$parent_sha" >/dev/null 2>&1; then
              echo "Reusable image is unavailable; rebuilding $component for $DEPLOY_SHA."
              changed=true
              tag="$DEPLOY_SHA"
            fi
            if [ "$changed" = true ]; then
              matrix=$(jq -c --arg component "$component" --arg context "$context" --arg dockerfile "$dockerfile" --arg tag "$tag" '. + [{component: $component, context: $context, dockerfile: $dockerfile, tag: $tag}]' <<< "$matrix")
            fi
            output_name=${component//-/_}
            printf '%s_tag=%s\n' "$output_name" "$tag" >> "$GITHUB_OUTPUT"
          done
          printf 'build_matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  build-images:
    name: build-and-push-${{ matrix.component }}
    needs: detect-changes
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      needs.detect-changes.outputs.latest == 'true'
    runs-on: ubuntu-latest
    environment: oci-staging
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.build_matrix) }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
      OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
      OCI_REPOSITORY: ${{ vars.OCI_REPOSITORY }}
      STAGING_PUBLIC_URL: ${{ vars.STAGING_PUBLIC_URL }}
      KAKAO_MAP_APP_KEY: ${{ vars.KAKAO_MAP_APP_KEY }}
      TOSS_PAYMENTS_CLIENT_KEY: ${{ secrets.TOSS_PAYMENTS_CLIENT_KEY }}
      JOURNEY_ENABLED: ${{ needs.detect-changes.outputs.journey_enabled }}

    steps:
      - name: Check required image configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in OCI_REGISTRY OCI_NAMESPACE OCI_REPOSITORY STAGING_PUBLIC_URL KAKAO_MAP_APP_KEY TOSS_PAYMENTS_CLIENT_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Required staging configuration is missing: $name" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OCI_REGISTRY" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$OCI_NAMESPACE" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$OCI_REPOSITORY" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$STAGING_PUBLIC_URL" =~ ^https://[A-Za-z0-9.:-]+$ ]]
          [[ "$TOSS_PAYMENTS_CLIENT_KEY" == test_* ]]
          [[ "$JOURNEY_ENABLED" == true || "$JOURNEY_ENABLED" == false ]]

      - name: Check out the successful main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Verify commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCI_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Mask frontend client configuration
        if: matrix.component == 'frontend'
        shell: bash
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$KAKAO_MAP_APP_KEY"
          printf '::add-mask::%s\n' "$TOSS_PAYMENTS_CLIENT_KEY"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          tags: ${{ env.OCI_REGISTRY }}/${{ env.OCI_NAMESPACE }}/${{ env.OCI_REPOSITORY }}/${{ matrix.component }}:${{ matrix.tag }}
          build-args: |
            ${{ matrix.component == 'frontend' && format('REACT_APP_API_BASE_URL={0}', env.STAGING_PUBLIC_URL) || '' }}
            ${{ matrix.component == 'frontend' && format('REACT_APP_JOURNEY_ENABLED={0}', env.JOURNEY_ENABLED) || '' }}
          secrets: |
            ${{ matrix.component == 'frontend' && format('kakao_map_app_key={0}', env.KAKAO_MAP_APP_KEY) || '' }}
            ${{ matrix.component == 'frontend' && format('toss_payments_client_key={0}', env.TOSS_PAYMENTS_CLIENT_KEY) || '' }}
          cache-from: type=gha,scope=staging-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=staging-${{ matrix.component }}

  deploy:
    name: deploy-oci-staging
    needs:
      - detect-changes
      - build-images
    if: >-
      always() &&
      needs.detect-changes.result == 'success' &&
      needs.detect-changes.outputs.latest == 'true' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: oci-staging
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
      OCI_REGISTRY: ${{ vars.OCI_REGISTRY }}
      OCI_NAMESPACE: ${{ vars.OCI_NAMESPACE }}
      OCI_REPOSITORY: ${{ vars.OCI_REPOSITORY }}
      STAGING_PUBLIC_URL: ${{ vars.STAGING_PUBLIC_URL }}
      REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR }}
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      TOSS_PAYMENTS_CLIENT_KEY: ${{ secrets.TOSS_PAYMENTS_CLIENT_KEY }}
      FRONTEND_TAG: ${{ needs.detect-changes.outputs.frontend_tag }}
      BACKEND_TAG: ${{ needs.detect-changes.outputs.backend_tag }}
      INFERENCE_TAG: ${{ needs.detect-changes.outputs.inference_tag }}
      INVENTORY_REFRESHER_TAG: ${{ needs.detect-changes.outputs.inventory_refresher_tag }}
      JOURNEY_ENABLED: ${{ needs.detect-changes.outputs.journey_enabled }}
      JOURNEY_AI_ENABLED: ${{ needs.detect-changes.outputs.journey_ai_enabled }}
      JOURNEY_AI_API_KEY: ${{ secrets.JOURNEY_AI_API_KEY }}
      JOURNEY_AI_MODEL: ${{ vars.JOURNEY_AI_MODEL }}
      JOURNEY_AI_RESPONSES_URI: ${{ vars.JOURNEY_AI_RESPONSES_URI }}
      JOURNEY_AI_TIMEOUT: ${{ vars.JOURNEY_AI_TIMEOUT }}

    steps:
      - name: Mask Journey AI server secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${JOURNEY_AI_API_KEY:-}" ]; then
            printf '::add-mask::%s\n' "$JOURNEY_AI_API_KEY"
          fi

      - name: Check required deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in OCI_REGISTRY OCI_NAMESPACE OCI_REPOSITORY STAGING_PUBLIC_URL REMOTE_APP_DIR SSH_HOST SSH_USER; do
            if [ -z "${!name:-}" ]; then
              echo "Required staging configuration is missing: $name" >&2
              exit 1
            fi
          done
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OCI_REGISTRY" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$OCI_NAMESPACE" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$OCI_REPOSITORY" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$STAGING_PUBLIC_URL" =~ ^https://[A-Za-z0-9.:-]+$ ]]
          [[ "$REMOTE_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$JOURNEY_ENABLED" == true || "$JOURNEY_ENABLED" == false ]]
          [[ "$JOURNEY_AI_ENABLED" == true || "$JOURNEY_AI_ENABLED" == false ]]
          if [ "$JOURNEY_AI_ENABLED" = true ]; then
            for name in JOURNEY_AI_API_KEY JOURNEY_AI_MODEL; do
              if [ -z "${!name:-}" ]; then
                echo "Required Journey AI configuration is missing: $name" >&2
                exit 1
              fi
            done
          fi

      - name: Check out the successful main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 0

      - name: Verify commit belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main

      - name: Stop stale deployment candidates
        id: fresh
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          latest_main=$(git rev-parse origin/main)
          if [ "$latest_main" != "$DEPLOY_SHA" ]; then
            echo "Skipping stale deployment candidate $DEPLOY_SHA; latest main is $latest_main."
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'deploy=true' >> "$GITHUB_OUTPUT"

      - name: Configure verified SSH access
        if: steps.fresh.outputs.deploy == 'true'
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_staging" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_staging" >/dev/null
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Prepare immutable release files
        if: steps.fresh.outputs.deploy == 'true'
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          KAKAO_CLIENT_ID: ${{ vars.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          AIRKOREA_SERVICE_KEY: ${{ secrets.AIRKOREA_SERVICE_KEY }}
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
          NAVER_CLIENT_ID: ${{ vars.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TOSS_PAYMENTS_SECRET_KEY: ${{ secrets.TOSS_PAYMENTS_SECRET_KEY }}
          MODEL_POINTER_KEY: ${{ vars.MODEL_POINTER_KEY }}
          MODEL_POINTER_SHA256: ${{ vars.MODEL_POINTER_SHA256 }}
        run: |
          set -euo pipefail
          for name in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET KAKAO_CLIENT_ID KAKAO_CLIENT_SECRET NAVER_CLIENT_ID NAVER_CLIENT_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "Required OAuth configuration is missing: $name" >&2
              exit 1
            fi
            if [[ ! "$value" =~ ^[A-Za-z0-9._~+/-]+$ ]]; then
              echo "OAuth configuration contains unsupported characters: $name" >&2
              exit 1
            fi
          done
          for name in KAKAO_REST_API_KEY AIRKOREA_SERVICE_KEY SEOUL_OPEN_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Required external API configuration is missing: $name" >&2
              exit 1
            fi
          done
          if [ -z "${TOSS_PAYMENTS_SECRET_KEY:-}" ] || [[ "$TOSS_PAYMENTS_SECRET_KEY" != test_* ]]; then
            echo "Required Toss test configuration is missing or invalid: TOSS_PAYMENTS_SECRET_KEY" >&2
            exit 1
          fi

          image_base="$OCI_REGISTRY/$OCI_NAMESPACE/$OCI_REPOSITORY"
          {
            printf 'FRONTEND_IMAGE=%s/frontend:%s\n' "$image_base" "$FRONTEND_TAG"
            printf 'BACKEND_IMAGE=%s/backend:%s\n' "$image_base" "$BACKEND_TAG"
            printf 'INFERENCE_IMAGE=%s/inference:%s\n' "$image_base" "$INFERENCE_TAG"
            printf 'INVENTORY_REFRESHER_IMAGE=%s/inventory-refresher:%s\n' "$image_base" "$INVENTORY_REFRESHER_TAG"
            printf 'REACT_APP_API_BASE_URL=%s\n' "$STAGING_PUBLIC_URL"
            printf 'REACT_APP_TOSS_PAYMENTS_CLIENT_KEY=%s\n' "$TOSS_PAYMENTS_CLIENT_KEY"
            printf 'PAYMENT_MODE=sandbox\n'
            printf 'DEPLOYED_COMMIT=%s\n' "$DEPLOY_SHA"
            printf 'JOURNEY_ENABLED=%s\n' "$JOURNEY_ENABLED"
            printf 'JOURNEY_AI_ENABLED=%s\n' "$JOURNEY_AI_ENABLED"
            printf 'JOURNEY_AI_MODEL=%s\n' "$JOURNEY_AI_MODEL"
            printf 'JOURNEY_AI_RESPONSES_URI=%s\n' "$JOURNEY_AI_RESPONSES_URI"
            printf 'JOURNEY_AI_TIMEOUT=%s\n' "$JOURNEY_AI_TIMEOUT"
            printf 'FRONTEND_IMAGE_TAG=%s\n' "$FRONTEND_TAG"
            printf 'BACKEND_IMAGE_TAG=%s\n' "$BACKEND_TAG"
            printf 'SWAGGER_ENABLED=true\n'
            printf 'FLYWAY_BASELINE_ON_MIGRATE=true\n'
            printf 'FLYWAY_BASELINE_VERSION=1\n'
            printf 'OCI_OBJECT_NAMESPACE=nrzeviuvbcrd\n'
            printf 'MODEL_BUCKET=ddarung-flow-bucket\n'
            printf 'MODEL_OBJECT_KEY=models/data-3.1/2f2ece729fd4b03954212d2fcc2ece4cd07110c947fae1dfc0c7ba29cde34db9/model_winner.joblib\n'
            printf 'MODEL_SHA256=2f2ece729fd4b03954212d2fcc2ece4cd07110c947fae1dfc0c7ba29cde34db9\n'
            if [ -n "${MODEL_POINTER_KEY:-}" ] && [ -n "${MODEL_POINTER_SHA256:-}" ]; then
              printf 'MODEL_POINTER_KEY=%s\n' "$MODEL_POINTER_KEY"
              printf 'MODEL_POINTER_SHA256=%s\n' "$MODEL_POINTER_SHA256"
            fi
          } > release.candidate.env
          umask 077
          {
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'KAKAO_CLIENT_ID=%s\n' "$KAKAO_CLIENT_ID"
            printf 'KAKAO_CLIENT_SECRET=%s\n' "$KAKAO_CLIENT_SECRET"
            printf 'KAKAO_REST_API_KEY=%s\n' "$KAKAO_REST_API_KEY"
            printf 'AIRKOREA_SERVICE_KEY=%s\n' "$AIRKOREA_SERVICE_KEY"
            printf 'KMA_SERVICE_KEY=%s\n' "$KMA_SERVICE_KEY"
            printf 'SEOUL_OPEN_API_KEY=%s\n' "$SEOUL_OPEN_API_KEY"
            printf 'NAVER_CLIENT_ID=%s\n' "$NAVER_CLIENT_ID"
            printf 'NAVER_CLIENT_SECRET=%s\n' "$NAVER_CLIENT_SECRET"
            printf 'TOSS_PAYMENTS_SECRET_KEY=%s\n' "$TOSS_PAYMENTS_SECRET_KEY"
          } > oauth.candidate.env
          if [ -n "${JOURNEY_AI_API_KEY:-}" ]; then
            env | grep -E '^JOURNEY_AI_API_KEY=' >> oauth.candidate.env
          fi
          chmod 600 oauth.candidate.env

      - name: Upload candidate release
        if: steps.fresh.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="$SSH_USER@$SSH_HOST"
          ssh -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" "mkdir -p '$REMOTE_APP_DIR'"
          scp -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes infra/staging/docker-compose.yaml "$target:$REMOTE_APP_DIR/docker-compose.yaml.candidate"
          scp -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes infra/staging/docker-compose.oci.yaml "$target:$REMOTE_APP_DIR/docker-compose.oci.yaml.candidate"
          scp -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes release.candidate.env "$target:$REMOTE_APP_DIR/release.candidate.env"
          scp -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes oauth.candidate.env "$target:$REMOTE_APP_DIR/oauth.candidate.env"

      - name: Deploy and automatically roll back on failed smoke
        if: steps.fresh.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target="$SSH_USER@$SSH_HOST"
          ssh -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
            "REMOTE_APP_DIR='$REMOTE_APP_DIR' STAGING_PUBLIC_URL='$STAGING_PUBLIC_URL' JOURNEY_ENABLED='$JOURNEY_ENABLED' JOURNEY_AI_ENABLED='$JOURNEY_AI_ENABLED' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_APP_DIR"
          test -f .env
          chmod 600 .env release.candidate.env oauth.candidate.env

          rollback() {
            echo "Staging deployment failed; restoring the previous release." >&2
            docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]:-}" logs --tail=160 backend 2>&1 || true
            if [ -f release.previous.env ] && [ -f oauth.previous.env ] && [ -f docker-compose.previous.yaml ]; then
              cp release.previous.env release.env
              cp oauth.previous.env oauth.env
              cp docker-compose.previous.yaml docker-compose.yaml
              if [ -f docker-compose.oci.previous.yaml ]; then
                cp docker-compose.oci.previous.yaml docker-compose.oci.yaml
              else
                rm -f docker-compose.oci.yaml
              fi
              chmod 600 release.env oauth.env
              compose_files=(-f docker-compose.yaml)
              if [ -f docker-compose.oci.yaml ]; then compose_files+=(-f docker-compose.oci.yaml); fi
              docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" pull
              docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" up -d --no-build --remove-orphans
            else
              echo "No previous release exists for automatic rollback." >&2
            fi
          }
          trap rollback ERR

          if [ -f release.env ]; then cp release.env release.previous.env; fi
          if [ -f oauth.env ]; then cp oauth.env oauth.previous.env; else cp oauth.candidate.env oauth.previous.env; fi
          if [ -f docker-compose.yaml ]; then cp docker-compose.yaml docker-compose.previous.yaml; fi
          if [ -f docker-compose.oci.yaml ]; then cp docker-compose.oci.yaml docker-compose.oci.previous.yaml; else rm -f docker-compose.oci.previous.yaml; fi
          mv release.candidate.env release.env
          mv oauth.candidate.env oauth.env
          mv docker-compose.yaml.candidate docker-compose.yaml
          mv docker-compose.oci.yaml.candidate docker-compose.oci.yaml
          chmod 600 release.env oauth.env

          compose_files=(-f docker-compose.yaml -f docker-compose.oci.yaml)
          release_journey_enabled=$(sed -n 's/^JOURNEY_ENABLED=//p' release.env)
          test "$release_journey_enabled" = "$JOURNEY_ENABLED"
          [[ "$release_journey_enabled" == true || "$release_journey_enabled" == false ]]
          release_journey_ai_enabled=$(sed -n 's/^JOURNEY_AI_ENABLED=//p' release.env)
          test "$release_journey_ai_enabled" = "$JOURNEY_AI_ENABLED"
          [[ "$release_journey_ai_enabled" == true || "$release_journey_ai_enabled" == false ]]
          if [ "$release_journey_ai_enabled" = true ]; then
            grep -Eq '^JOURNEY_AI_MODEL=.+$' release.env
            grep -Eq '^JOURNEY_AI_API_KEY=.+$' oauth.env
          fi
          mapfile -t frontend_flag_values < <(docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" config | awk '$1 == "REACT_APP_JOURNEY_ENABLED:" { gsub(/"/, "", $2); print $2 }')
          mapfile -t backend_flag_values < <(docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" config | awk '$1 == "JOURNEY_ENABLED:" { gsub(/"/, "", $2); print $2 }')
          mapfile -t backend_ai_flag_values < <(docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" config | awk '$1 == "JOURNEY_AI_ENABLED:" { gsub(/"/, "", $2); print $2 }')
          [ "${#frontend_flag_values[@]}" -eq 1 ]
          [ "${#backend_flag_values[@]}" -eq 1 ]
          [ "${#backend_ai_flag_values[@]}" -eq 1 ]
          test "${frontend_flag_values[0]}" = "$release_journey_enabled"
          test "${backend_flag_values[0]}" = "$release_journey_enabled"
          test "${backend_ai_flag_values[0]}" = "$release_journey_ai_enabled"
          docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" config --quiet

          # Every deploy pulls four SHA-tagged images that nothing removes, so the
          # host filled to 100% and pull failed with "no space left on device".
          # Reclaim only when space is actually short, keeping the last day of
          # images so this release and its rollback target survive.
          available_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          echo "Root filesystem available: $((available_kb / 1024)) MiB"
          if [ "$available_kb" -lt 10485760 ]; then
            echo "Less than 10 GiB free. Pruning unused images older than 24h before pull."
            docker image prune -af --filter "until=24h" || true
            df -h / | tail -1
          fi

          docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" pull frontend backend postgres inference inventory-refresher
          docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" up -d --no-build --remove-orphans

          staging_healthy=false
          for attempt in $(seq 1 18); do
            postgres_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ddarung-flow-staging-postgres-1 2>/dev/null || true)
            inference_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ddarung-flow-staging-inference-1 2>/dev/null || true)
            frontend_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/ || true)
            proxy_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/v1/auth/me || true)
            public_frontend_code=$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_PUBLIC_URL/" || true)
            public_proxy_code=$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_PUBLIC_URL/api/v1/auth/me" || true)
            if [ "$postgres_status" = healthy ] && [ "$inference_status" = healthy ] && [ "$frontend_code" = 200 ] && [[ "$proxy_code" =~ ^(200|401|403)$ ]] && [ "$public_frontend_code" = 200 ] && [[ "$public_proxy_code" =~ ^(200|401|403)$ ]]; then
              staging_healthy=true
              break
            fi
            sleep 5
          done
          if [ "$staging_healthy" != true ]; then
            echo "Staging health checks did not pass before timeout." >&2
            false
          fi

          for provider in google kakao naver; do
            authorization_url=$(curl -sS -o /dev/null -w '%{redirect_url}' "$STAGING_PUBLIC_URL/oauth2/authorization/$provider")
            if ! AUTHORIZATION_URL="$authorization_url" EXPECTED_CALLBACK="$STAGING_PUBLIC_URL/login/oauth2/code/$provider" python3 -c 'import os, sys, urllib.parse; query = urllib.parse.parse_qs(urllib.parse.urlsplit(os.environ["AUTHORIZATION_URL"]).query); sys.exit(0 if query.get("redirect_uri") == [os.environ["EXPECTED_CALLBACK"]] else 1)'; then
              echo "OAuth HTTPS callback verification failed: $provider" >&2
              false
            fi
          done

          trap - ERR
          docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" ps
          echo "Public staging and OAuth HTTPS callback verification passed."

          # The rollback trap is disarmed and the release is verified, so old
          # images are no longer needed locally. A later rollback re-pulls from
          # the registry, so removing them does not weaken recovery.
          # Never fail the deploy on cleanup.
          docker image prune -af --filter "until=168h" || true
          df -h / | tail -1
          REMOTE

  verify-automatic-rollback:
    name: verify-automatic-rollback
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'ROLLBACK_TEST'
    runs-on: ubuntu-latest
    environment: oci-staging
    env:
      STAGING_PUBLIC_URL: ${{ vars.STAGING_PUBLIC_URL }}
      REMOTE_APP_DIR: ${{ vars.REMOTE_APP_DIR }}
      SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}

    steps:
      - name: Check rollback test configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = ROLLBACK_TEST
          for name in STAGING_PUBLIC_URL REMOTE_APP_DIR SSH_HOST SSH_USER; do
            if [ -z "${!name:-}" ]; then
              echo "Required staging configuration is missing: $name" >&2
              exit 1
            fi
          done
          [[ "$STAGING_PUBLIC_URL" =~ ^https://[A-Za-z0-9.:-]+$ ]]
          [[ "$REMOTE_APP_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_staging"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_staging" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_staging" >/dev/null
          ssh-keygen -F "$SSH_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Inject failure and invoke automatic rollback
        id: inject
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          target="$SSH_USER@$SSH_HOST"
          ssh -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
            "REMOTE_APP_DIR='$REMOTE_APP_DIR' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_APP_DIR"
          for file in .env release.env oauth.env docker-compose.yaml release.previous.env oauth.previous.env docker-compose.previous.yaml; do
            test -f "$file"
          done

          current_sha=$(sed -n 's/^DEPLOYED_COMMIT=//p' release.env)
          previous_sha=$(sed -n 's/^DEPLOYED_COMMIT=//p' release.previous.env)
          [[ "$current_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$previous_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$current_sha" != "$previous_sha"
          printf 'EXPECTED_ROLLBACK_SHA=%s\n' "$previous_sha" > rollback-test.expected.env
          chmod 600 rollback-test.expected.env

          rollback() {
            echo "ROLLBACK_TEST_INJECTED: restoring previous release $previous_sha" >&2
            cp release.previous.env release.env
            cp oauth.previous.env oauth.env
            cp docker-compose.previous.yaml docker-compose.yaml
            if [ -f docker-compose.oci.previous.yaml ]; then
              cp docker-compose.oci.previous.yaml docker-compose.oci.yaml
            else
              rm -f docker-compose.oci.yaml
            fi
            chmod 600 release.env oauth.env
            compose_files=(-f docker-compose.yaml)
            if [ -f docker-compose.oci.yaml ]; then compose_files+=(-f docker-compose.oci.yaml); fi
            docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" pull
            docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" up -d --no-build --remove-orphans
          }
          trap rollback ERR

          echo "ROLLBACK_TEST_TRIGGER: intentional failure after preserving current=$current_sha previous=$previous_sha"
          false
          REMOTE

      - name: Verify restored release and smoke
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.inject.outcome }}" = failure
          target="$SSH_USER@$SSH_HOST"
          ssh -i "$HOME/.ssh/id_staging" -o BatchMode=yes -o StrictHostKeyChecking=yes "$target" \
            "REMOTE_APP_DIR='$REMOTE_APP_DIR' STAGING_PUBLIC_URL='$STAGING_PUBLIC_URL' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_APP_DIR"
          test -f rollback-test.expected.env
          expected_sha=$(sed -n 's/^EXPECTED_ROLLBACK_SHA=//p' rollback-test.expected.env)
          deployed_sha=$(sed -n 's/^DEPLOYED_COMMIT=//p' release.env)
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          test "$deployed_sha" = "$expected_sha"
          compose_files=(-f docker-compose.yaml)
          if [ -f docker-compose.oci.yaml ]; then compose_files+=(-f docker-compose.oci.yaml); fi
          docker compose --env-file .env --env-file oauth.env --env-file release.env "${compose_files[@]}" config --quiet

          restored_healthy=false
          for attempt in $(seq 1 18); do
            postgres_status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' ddarung-flow-staging-postgres-1 2>/dev/null || true)
            frontend_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/ || true)
            proxy_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/api/v1/auth/me || true)
            public_frontend_code=$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_PUBLIC_URL/" || true)
            public_proxy_code=$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_PUBLIC_URL/api/v1/auth/me" || true)
            if [ "$postgres_status" = healthy ] && [ "$frontend_code" = 200 ] && [[ "$proxy_code" =~ ^(200|401|403)$ ]] && [ "$public_frontend_code" = 200 ] && [[ "$public_proxy_code" =~ ^(200|401|403)$ ]]; then
              restored_healthy=true
              break
            fi
            sleep 5
          done
          test "$restored_healthy" = true

          for provider in google kakao naver; do
            authorization_url=$(curl -sS -o /dev/null -w '%{redirect_url}' "$STAGING_PUBLIC_URL/oauth2/authorization/$provider")
            AUTHORIZATION_URL="$authorization_url" EXPECTED_CALLBACK="$STAGING_PUBLIC_URL/login/oauth2/code/$provider" python3 -c 'import os, sys, urllib.parse; query = urllib.parse.parse_qs(urllib.parse.urlsplit(os.environ["AUTHORIZATION_URL"]).query); sys.exit(0 if query.get("redirect_uri") == [os.environ["EXPECTED_CALLBACK"]] else 1)'
          done

          rm -f rollback-test.expected.env
          echo "ROLLBACK_VERIFICATION_PASSED: restored=$deployed_sha frontend=$frontend_code proxy=$proxy_code postgres=$postgres_status"
          REMOTE
