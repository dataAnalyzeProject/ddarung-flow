name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      backend: ${{ steps.paths.outputs.backend }}
      pipeline: ${{ steps.paths.outputs.pipeline }}
      inference: ${{ steps.paths.outputs.inference }}
      workflow_validation: ${{ steps.paths.outputs.workflow_validation }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            {
              echo 'frontend=true'
              echo 'backend=true'
              echo 'pipeline=true'
              echo 'inference=true'
              echo 'workflow_validation=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          all=false
          frontend=false
          backend=false
          pipeline=false
          inference=false
          workflow_validation=false
          while IFS= read -r path; do
            case "$path" in
              frontend/*) frontend=true ;;
              backend/*) backend=true ;;
              pipeline/*) pipeline=true ;;
              infra/inference/*) inference=true ;;
              infra/staging/journey-release-flags.env)
                frontend=true
                backend=true
                workflow_validation=true
                ;;
              infra/staging/journey-ai-release-flags.env)
                frontend=true
                backend=true
                workflow_validation=true
                ;;
              infra/staging/*) inference=true ;;
              .github/workflows/*) workflow_validation=true ;;
              *) all=true ;;
            esac
          done < <(git diff --name-only "$base_sha" "$head_sha")
          if [ "$all" = true ]; then
            frontend=true
            backend=true
            pipeline=true
            inference=true
            workflow_validation=true
          fi
          printf 'frontend=%s\nbackend=%s\npipeline=%s\ninference=%s\nworkflow_validation=%s\n' \
            "$frontend" "$backend" "$pipeline" "$inference" "$workflow_validation" >> "$GITHUB_OUTPUT"

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: bash ./gradlew test

  pipeline:
    name: pipeline
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -m pytest pipeline/tests -q

  inference:
    name: inference
    needs: changes
    if: needs.changes.outputs.inference == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s infra/inference -p test_app.py -v
      - run: docker compose --env-file infra/staging/.env.example -f infra/staging/docker-compose.yaml config --quiet
      - run: docker build --tag ddarung-flow-inference:ci infra/inference

  workflow-validation:
    name: workflow-validation
    needs: changes
    if: needs.changes.outputs.workflow_validation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate versioned Journey release flag
        shell: bash
        run: |
          set -euo pipefail
          read_journey_enabled() {
            local flag_file=$1
            local lines=()
            mapfile -t lines < "$flag_file"
            [ "${#lines[@]}" -eq 1 ] || return 1
            case "${lines[0]}" in
              JOURNEY_ENABLED=true) printf 'true\n' ;;
              JOURNEY_ENABLED=false) printf 'false\n' ;;
              *) return 1 ;;
            esac
          }

          checked_in_value="$(read_journey_enabled infra/staging/journey-release-flags.env)"
          [[ "$checked_in_value" == true || "$checked_in_value" == false ]]
          flag_test_file=$(mktemp)
          trap 'rm -f "$flag_test_file"' EXIT
          printf 'JOURNEY_ENABLED=false\n' > "$flag_test_file"
          test "$(read_journey_enabled "$flag_test_file")" = false
          printf 'JOURNEY_ENABLED=true\n' > "$flag_test_file"
          test "$(read_journey_enabled "$flag_test_file")" = true
          for invalid_value in 'JOURNEY_ENABLED=' 'JOURNEY_ENABLED=TRUE' 'JOURNEY_ENABLED=1' 'JOURNEY_ENABLED=yes' 'JOURNEY_ENABLED=false '; do
            printf '%s\n' "$invalid_value" > "$flag_test_file"
            if read_journey_enabled "$flag_test_file" >/dev/null; then
              echo "Invalid Journey release flag was accepted: $invalid_value" >&2
              exit 1
            fi
          done
          printf 'JOURNEY_ENABLED=false\nJOURNEY_ENABLED=true\n' > "$flag_test_file"
          if read_journey_enabled "$flag_test_file" >/dev/null; then
            echo 'Multiple Journey release flag lines were accepted.' >&2
            exit 1
          fi
      - name: Validate versioned Journey AI release flag
        shell: bash
        run: |
          set -euo pipefail
          read_journey_ai_enabled() {
            local flag_file=$1
            local lines=()
            mapfile -t lines < "$flag_file"
            [ "${#lines[@]}" -eq 1 ] || return 1
            case "${lines[0]}" in
              JOURNEY_AI_ENABLED=true) printf 'true\n' ;;
              JOURNEY_AI_ENABLED=false) printf 'false\n' ;;
              *) return 1 ;;
            esac
          }

          checked_in_value="$(read_journey_ai_enabled infra/staging/journey-ai-release-flags.env)"
          [[ "$checked_in_value" == true || "$checked_in_value" == false ]]
          flag_test_file=$(mktemp)
          trap 'rm -f "$flag_test_file"' EXIT
          printf 'JOURNEY_AI_ENABLED=false\n' > "$flag_test_file"
          test "$(read_journey_ai_enabled "$flag_test_file")" = false
          printf 'JOURNEY_AI_ENABLED=true\n' > "$flag_test_file"
          test "$(read_journey_ai_enabled "$flag_test_file")" = true
          for invalid_value in 'JOURNEY_AI_ENABLED=' 'JOURNEY_AI_ENABLED=TRUE' 'JOURNEY_AI_ENABLED=1' 'JOURNEY_AI_ENABLED=yes' 'JOURNEY_AI_ENABLED=false '; do
            printf '%s\n' "$invalid_value" > "$flag_test_file"
            if read_journey_ai_enabled "$flag_test_file" >/dev/null; then
              echo "Invalid Journey AI release flag was accepted: $invalid_value" >&2
              exit 1
            fi
          done
          printf 'JOURNEY_AI_ENABLED=false\nJOURNEY_AI_ENABLED=true\n' > "$flag_test_file"
          if read_journey_ai_enabled "$flag_test_file" >/dev/null; then
            echo 'Multiple Journey AI release flag lines were accepted.' >&2
            exit 1
          fi
      - name: Lint deployment workflows
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            rhysd/actionlint:1.7.8 \
            .github/workflows/ci.yml \
            .github/workflows/staging-deploy.yml
      - name: Guard frontend build key handling
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq '^[[:space:]]*ARG[[:space:]]+REACT_APP_.*KEY' frontend/Dockerfile; then
            echo 'Frontend key configuration must not use Docker ARG.' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*ENV[[:space:]]+REACT_APP_.*KEY' frontend/Dockerfile; then
            echo 'Frontend key configuration must not use Docker ENV.' >&2
            exit 1
          fi
          grep -Eq -- '--mount=type=secret,id=kakao_map_app_key' frontend/Dockerfile
          grep -Eq -- '--mount=type=secret,id=toss_payments_client_key' frontend/Dockerfile
          if awk '
            /^[[:space:]]*build-args:[[:space:]]*\|/ { in_build_args = 1; next }
            in_build_args && /^[[:space:]]*[[:alnum:]_-]+:/ { in_build_args = 0 }
            in_build_args && /REACT_APP_.*KEY/ { found = 1 }
            END { exit !found }
          ' .github/workflows/staging-deploy.yml; then
            echo 'Frontend key configuration must not be passed through build-args.' >&2
            exit 1
          fi
          grep -Eq 'kakao_map_app_key=.*env\.KAKAO_MAP_APP_KEY' .github/workflows/staging-deploy.yml
          grep -Eq 'toss_payments_client_key=.*env\.TOSS_PAYMENTS_CLIENT_KEY' .github/workflows/staging-deploy.yml
      - name: Guard Journey AI server-only handling
        shell: bash
        run: |
          set -euo pipefail
          read_journey_ai_enabled() {
            local flag_file=$1
            local lines=()
            mapfile -t lines < "$flag_file"
            [ "${#lines[@]}" -eq 1 ] || return 1
            case "${lines[0]}" in
              JOURNEY_AI_ENABLED=true) printf 'true\n' ;;
              JOURNEY_AI_ENABLED=false) printf 'false\n' ;;
              *) return 1 ;;
            esac
          }
          checked_in_value="$(read_journey_ai_enabled infra/staging/journey-ai-release-flags.env)"
          [[ "$checked_in_value" == true || "$checked_in_value" == false ]]
          if rg -n 'JOURNEY_AI_API_KEY' frontend; then
            echo 'JOURNEY_AI_API_KEY must not be referenced by frontend files.' >&2
            exit 1
          fi
          if awk '
            /^[[:space:]]*build-args:[[:space:]]*\|/ { in_build_args = 1; next }
            in_build_args && /^[[:space:]]*[[:alnum:]_-]+:/ { in_build_args = 0 }
            in_build_args && /JOURNEY_AI_API_KEY/ { found = 1 }
            END { exit !found }
          ' .github/workflows/staging-deploy.yml; then
            echo 'JOURNEY_AI_API_KEY must not be passed through Docker build args.' >&2
            exit 1
          fi
          if rg -n --glob 'Dockerfile*' 'JOURNEY_AI_API_KEY' .; then
            echo 'JOURNEY_AI_API_KEY must not be used by Docker build files.' >&2
            exit 1
          fi
          direct_output=$(rg -n 'JOURNEY_AI_API_KEY' .github/workflows/staging-deploy.yml | rg '(echo|printf)' || true)
          if [ -n "$(printf '%s\n' "$direct_output" | grep -v '::add-mask::' || true)" ]; then
            echo 'JOURNEY_AI_API_KEY must not be emitted by echo or printf.' >&2
            exit 1
          fi
          if git grep -n -E 'sk-(proj-)?[A-Za-z0-9_-]{20,}'; then
            echo 'A checked-in Journey AI API key pattern was found.' >&2
            exit 1
          fi
          if rg -n 'OPENAI_' backend infra/staging docs/journey .github/workflows/staging-deploy.yml; then
            echo 'Legacy OPENAI runtime wiring must not remain.' >&2
            exit 1
          fi
      - name: Verify frontend BuildKit secrets stay out of build metadata
        shell: bash
        run: |
          set -euo pipefail
          sentinel=$(uuidgen | tr -d '-')
          kakao_secret=$(mktemp)
          toss_secret=$(mktemp)
          build_log=$(mktemp)
          image_tag="ddarung-flow-frontend-secret-guard:${GITHUB_SHA}"
          trap 'rm -f "$kakao_secret" "$toss_secret" "$build_log"; docker image rm -f "$image_tag" >/dev/null 2>&1 || true' EXIT
          printf '%s' "$sentinel-kakao" > "$kakao_secret"
          printf '%s' "$sentinel-toss" > "$toss_secret"
          docker buildx build --load --progress=plain \
            --tag "$image_tag" \
            --build-arg REACT_APP_API_BASE_URL=https://example.invalid \
            --build-arg REACT_APP_JOURNEY_ENABLED=false \
            --secret id=kakao_map_app_key,src="$kakao_secret" \
            --secret id=toss_payments_client_key,src="$toss_secret" \
            --file frontend/Dockerfile frontend > "$build_log" 2>&1
          if grep -Fq -- "$sentinel" "$build_log"; then
            echo 'Frontend BuildKit sentinel appeared in the captured build log.' >&2
            exit 1
          fi
          if docker history --no-trunc "$image_tag" | grep -Fq -- "$sentinel"; then
            echo 'Frontend BuildKit sentinel appeared in Docker image history.' >&2
            exit 1
          fi
