name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      backend: ${{ steps.paths.outputs.backend }}
      pipeline: ${{ steps.paths.outputs.pipeline }}
      inference: ${{ steps.paths.outputs.inference }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = push ]; then
            {
              echo 'frontend=true'
              echo 'backend=true'
              echo 'pipeline=true'
              echo 'inference=true'
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          base_sha='${{ github.event.pull_request.base.sha }}'
          head_sha='${{ github.event.pull_request.head.sha }}'
          all=false
          frontend=false
          backend=false
          pipeline=false
          inference=false
          while IFS= read -r path; do
            case "$path" in
              frontend/*) frontend=true ;;
              backend/*) backend=true ;;
              pipeline/*) pipeline=true ;;
              infra/inference/*|infra/staging/*) inference=true ;;
              *) all=true ;;
            esac
          done < <(git diff --name-only "$base_sha" "$head_sha")
          if [ "$all" = true ]; then
            frontend=true
            backend=true
            pipeline=true
            inference=true
          fi
          printf 'frontend=%s\nbackend=%s\npipeline=%s\ninference=%s\n' \
            "$frontend" "$backend" "$pipeline" "$inference" >> "$GITHUB_OUTPUT"

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watchAll=false
      - run: npm run build

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: bash ./gradlew test

  pipeline:
    name: pipeline
    needs: changes
    if: needs.changes.outputs.pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: python -m pip install -r pipeline/requirements.txt
      - run: python -m pytest pipeline/tests -q

  inference:
    name: inference
    needs: changes
    if: needs.changes.outputs.inference == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s infra/inference -p test_app.py -v
      - run: docker compose --env-file infra/staging/.env.example -f infra/staging/docker-compose.yaml config --quiet
      - run: docker build --tag ddarung-flow-inference:ci infra/inference
